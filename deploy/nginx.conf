# ---------------------------------------------------------------------------
# 玻璃套件中心 nginx 配置
#
# 同时承担两个角色：
#   1) 浏览器访问：返回单文件 index.html（SPA）
#   2) DSM 套件来源：识别 ?unique=synology_... 协议请求，返回 SSPKS 格式 JSON
#
# DSM 在「套件中心 → 设置 → 套件来源 → 新增」时会请求：
#   GET /?unique=synology_<arch>_<model>&arch=<arch>&major=7&minor=x&build=x&language=chs
# 只有返回合法的 {"packages":[...]} 才会通过校验，否则报「无效的位置」。
# ---------------------------------------------------------------------------

# 是否为 DSM 套件中心协议请求（关键判据：unique 参数以 synology_ 开头）
map $arg_unique $gpc_is_dsm {
    default       0;
    "~^synology_" 1;
}

# DSM 架构族映射到清单文件；未知架构统一回落到 noarch（noarch 包全架构可用）
map $arg_arch $gpc_arch {
    default noarch;
    x86_64  x86_64;
    armv8   armv8;
    armv7   armv8;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 首页：DSM 协议请求走 JSON，其余走浏览器页面
    location = / {
        if ($gpc_is_dsm) {
            rewrite ^ /dsm/synology-$gpc_arch.json last;
        }
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # 兼容 DSM 请求 /index.html?unique=... 的情况
    location = /index.html {
        if ($gpc_is_dsm) {
            rewrite ^ /dsm/synology-$gpc_arch.json last;
        }
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # DSM 协议清单：把占位符替换为实际访问地址，无需写死 NAS 的 IP/端口
    # 允许直访，便于浏览器打开 /dsm/synology-x86_64.json 做部署自检。
    location ^~ /dsm/ {
        types { }
        default_type application/json;
        sub_filter_types application/json;
        sub_filter '__DSM_ORIGIN__' '$scheme://$http_host';
        sub_filter_once off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPK 安装包下载：强制附件下载 + 允许大文件
    location /packages/ {
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment';
        sendfile on;
        tcp_nopush on;
        client_max_body_size 0;
    }

    # 其余静态资源 / SPA 回退
    location / {
        if ($gpc_is_dsm) {
            rewrite ^ /dsm/synology-$gpc_arch.json last;
        }
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
