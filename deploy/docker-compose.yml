services:
  glass-package-center:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: glass-package-center:latest
    container_name: glass-package-center
    restart: unless-stopped
    ports:
      # 左侧为群晖对外端口，按实际改；右侧 80 为容器内端口，勿动
      - "8380:80"
    environment:
      - TZ=Asia/Shanghai
      - GPC_SCAN_INTERVAL=30
    volumes:
      # 上传的安装包与登记表：不挂卷的话，重建容器会丢
      - ./data:/data
      # 可选：把 SPK 打包目录只读挂进来，新生成的包会自动收录
      # - /volume1/docker/spk-studio/builds:/import:ro
