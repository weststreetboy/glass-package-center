.gw-root[data-theme="light"] {
  color-scheme: light;
}
.gw-root[data-theme="dark"] {
  color-scheme: dark;
}
.gw-root * {
  box-sizing: border-box;
}
.gw-root ::selection {
  background: var(--gw-selection);
}
.gw-root button,
.gw-root input,
.gw-root a {
  font: inherit;
  color: inherit;
}
.gw-root button {
  cursor: pointer;
}
.gw-root button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
.gw-root button,
.gw-root a,
.gw-root input {
  outline-offset: 4px;
}
.gw-root :focus-visible {
  outline: 2px solid var(--gw-accent);
}
.gw-root button {
  border: 0;
  background: none;
}
.gw-root h1,
.gw-root h2,
.gw-root h3,
.gw-root p {
  margin: 0;
}
.gw-room {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 56%;
  z-index: -3;
}
.gw-room-shade {
  position: absolute;
  inset: 0;
  background: var(--gw-shade);
  z-index: -2;
}
.gw-workspace {
  position: relative;
  width: min(1280px, 100%);
  margin: auto;
}
.gw-glass {
  background: color-mix(
    in srgb,
    var(--gw-surface) calc(var(--gw-opacity) * 100%),
    transparent
  );
  backdrop-filter: blur(var(--gw-blur)) saturate(var(--gw-saturation));
  -webkit-backdrop-filter: blur(var(--gw-blur)) saturate(var(--gw-saturation));

    inset 0 1px 0

        in srgb,
        var(--gw-highlight) calc(var(--gw-edge) * 100%),
        transparent
      ),
    inset 0 0 0 1px
      color-mix(
        in srgb,
        var(--gw-highlight) calc(var(--gw-edge) * 34%),
        transparent
      ),
    0 20px 52px -25px var(--gw-shadow);
  position: relative;
}
.gw-glass:before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--gw-tint);
  opacity: 0.12;
  pointer-events: none;
  border-radius: inherit;
}

  align-items: center;

  padding: 0 20px;
}
.gw-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  white-space: nowrap;
}
.gw-brand strong {
  font-size: 14px;
  letter-spacing: -0.025em;
}
.gw-brand-icon {
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  background: var(--gw-brand);
  color: var(--gw-brand-ink);
  border-radius: 9px;
}
.gw-brand-divider {
  height: 16px;
  width: 1px;
  background: var(--gw-line);
  margin: 0 4px;
}
.gw-personal {
  font-size: 12px;
  color: var(--gw-muted);
}
.gw-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
}
.gw-adjust {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 9px;
  padding: 8px 10px;
}
.gw-adjust:hover {
  background: var(--gw-hover);
}
.gw-icon-button {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  flex: none;
}
.gw-icon-button:hover {
  background: var(--gw-hover);
}
.gw-bell {
  position: relative;
}
.gw-bell i {
  position: absolute;
  right: 8px;
  top: 6px;
  background: var(--gw-accent);
  width: 4px;
  height: 4px;
  border-radius: 50%;
}
.gw-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--gw-avatar);
  display: grid;
  place-items: center;
  font:
    600 12px Georgia,
    serif;
}
.gw-stage {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.gw-rail {
  border-radius: 23px;
  width: 50px;
  padding: 8px 5px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 50px;
  flex: none;
}
.gw-rail button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.gw-rail button span {
  display: none;
}
.gw-rail button[aria-current] {
  background: var(--gw-rail-active);
  box-shadow: 0 3px 8px var(--gw-soft-shadow);
}
.gw-main {
  border-radius: 27px;
  padding: 30px 30px 98px;
  flex: 1;
  min-width: 0;
}
.gw-view-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 28px;
}
.gw-greeting {
  font-size: 13px;
  color: var(--gw-muted);
  margin-bottom: 5px !important;
}
.gw-view-heading h1 {
  font-size: clamp(23px, 2.3vw, 31px);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.18;
}
.gw-date {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--gw-muted);
  white-space: nowrap;
}
.gw-panel {
  background: color-mix(
    in srgb,
    var(--gw-panel) calc((0.16 + var(--gw-opacity) * 0.5) * 100%),
    transparent
  );
  border-radius: 17px;
  box-shadow:
    inset 0 1px 0
      color-mix(
        in srgb,
        var(--gw-highlight) calc(var(--gw-edge) * 75%),

  padding: 21px;
  min-width: 0;
  position: relative;
}
.gw-panel-title {

  align-items: center;
  justify-content: space-between;

  margin-right: 5px;
}

  gap: 10px;

  border-radius: 10px;
  background: var(--gw-account-surface);

  flex-direction: column;

.gw-account strong {
  font-weight: 500;
  font-size: 12px;
}
.gw-account span {

  display: grid;

  gap: 6px;

  height: 7px;

  align-items: center;
  gap: 5px;

.gw-chart-summary i {
  width: 5px;
  height: 5px;
  background: var(--gw-accent);

}
.gw-chart-summary > div + div i {
  background: var(--gw-muted);
}
.gw-chart-summary strong {
  font-size: 21px;

}
.gw-chart-wrap {

.gw-chart-months {

  font-size: 12px;
  font-weight: 500;

.gw-goal-icon {

  height: 30px;
  border-radius: 9px;
  background: var(--gw-goal-surface);

  place-items: center;
}
.gw-goal-track {

  margin: 11px 0 6px;
  border-radius: 5px;

.gw-goal-track i {

  display: block;
  background: var(--gw-accent);
  border-radius: 5px;
}
.gw-goal p {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-goal p strong {
  font-weight: 500;
  color: var(--gw-ink);
}
.gw-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--gw-muted);
  font-size: 9px;
  margin-top: 22px;
  gap: 16px;
}
.gw-footer > span:first-child {
  display: flex;
  align-items: center;
  gap: 6px;
}
.gw-footer i {
  height: 4px;
  width: 4px;
  background: var(--gw-accent);
  border-radius: 50%;
}
.gw-desktop-dock {
  position: absolute;
  bottom: 19px;
  left: 50%;
  transform: translateX(-50%);
}
.gw-dock {
  display: flex;
  align-items: center;
  gap: 3px;
  border-radius: 30px;
  padding: 5px;
  white-space: nowrap;
  background: var(--gw-dock);
  backdrop-filter: blur(20px);
}
.gw-dock button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 24px;
  padding: 10px 17px;
  font-size: 11px;
  transition:
    background 0.22s,
    color 0.22s;
}
.gw-dock button svg {
  width: 15px;
}
.gw-dock button[aria-current] {
  background: var(--gw-dock-active);
  color: var(--gw-dock-ink);
  box-shadow: 0 3px 7px var(--gw-dock-shadow);
}
.gw-dock button:not([aria-current]):hover {
  background: var(--gw-dock-hover);
}
.gw-mobile-nav {
  display: none;
}
.gw-button {
  padding: 9px 13px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--gw-button) !important;
  color: var(--gw-button-ink) !important;
  font-size: 11px !important;
  white-space: nowrap;
}
.gw-button:hover {
  filter: brightness(1.13);
}
.gw-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--gw-search);
  border: 1px solid var(--gw-line);
  border-radius: 8px;
  padding: 7px 10px;
}
.gw-search input {
  width: 165px;
  background: none;
  border: 0;
  caret-color: var(--gw-accent);
  font-size: 11px;
}
.gw-search input::placeholder {
  color: var(--gw-muted);
}
.gw-search button {
  padding: 0;
  display: flex;
}
.gw-count {
  margin-left: 6px;
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-empty {
  text-align: center;
  padding: 70px 15px;
  color: var(--gw-muted);
  font-size: 12px;
}
.gw-empty svg {
  margin-bottom: 12px;
}
.gw-empty h3 {
  font-size: 15px;
  color: var(--gw-ink);
  margin-bottom: 6px;
}
.gw-empty button {
  margin-top: 15px;
  text-decoration: underline;
}
.gw-savings-intro {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px 10px 35px;
}
.gw-savings-orb {
  width: 65px;
  height: 65px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gw-savings-orb);
  box-shadow: inset 0 1px 0 var(--gw-strong-edge);
}
.gw-savings-intro p {
  font-size: 12px;
  color: var(--gw-muted);
}
.gw-savings-intro strong {
  font-size: 40px;
  letter-spacing: -0.04em;
  font-weight: 500;
}
.gw-savings-intro > span:last-child {
  margin-left: auto;
  font-size: 13px;
  color: var(--gw-muted);
}
.gw-view:has(.gw-savings-intro) .gw-goals {
  display: grid;

  gap: 34px;
}
.gw-view:has(.gw-savings-intro) .gw-goal + .gw-goal {
  margin-top: 0;
}
.gw-savings-note {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--gw-muted);
  font-size: 12px;
  padding: 24px 4px;
}
.gw-report-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.gw-report-stats strong {
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.035em;
  display: block;
}
.gw-report-stats section > span {
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-report-stats .gw-panel-title {
  margin-bottom: 15px;
}
.gw-reports-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 16px;
}
.gw-reports-grid .gw-chart-wrap svg {
  height: 185px;
}
.gw-chart-footnote {
  font-size: 9px;
  color: var(--gw-muted);
  margin-top: 15px !important;
}
.gw-category-list > div + div {
  margin-top: 19px;
}
.gw-category-list > div > div {
  display: flex;
  gap: 7px;
  align-items: center;
  font-size: 11px;
}
.gw-category-list strong {
  margin-left: auto;
  font-weight: 500;
}
.gw-category-list svg {
  width: 14px;
}
.gw-category-track {
  display: block;
  height: 4px;
  border-radius: 3px;
  background: var(--gw-line);
  margin-top: 9px;
}
.gw-category-track i {
  display: block;
  height: 100%;
  background: var(--gw-accent);
  border-radius: 3px;
}
.gw-material {
  position: absolute;
  z-index: 20;
  max-height: calc(100svh - 128px);
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--gw-scrollbar) transparent;
  right: 10px;
  top: 75px;
  width: 300px;
  border-radius: 22px;
  padding: 22px;
  background: var(--gw-popover);
  box-shadow:

    0 24px 80px var(--gw-popover-shadow);
}
.gw-material-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.gw-material-title > div {
  display: flex;
  gap: 10px;
  align-items: center;
}
.gw-material h2 {
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.03em;
}
.gw-material-icon {
  display: grid;
  place-items: center;
}
.gw-material > p {
  font-size: 11px;
  color: var(--gw-muted);

  margin-bottom: 20px;
}

  border-radius: 7px;
  padding: 6px 0;
  font-size: 11px;
}
.gw-presets button:hover {
  background: var(--gw-control-hover);
}
.gw-range {
  display: block;
  margin: 17px 0;
}
.gw-range > span {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
}
.gw-range output {
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-range input {
  width: 100%;
  accent-color: var(--gw-accent);
  height: 16px;
  margin: 8px 0 0;
  cursor: pointer;
}
.gw-tint {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  margin-top: 20px;
}
.gw-tint input {
  height: 28px;
  width: 42px;
  padding: 2px;
  background: none;
  border: 1px solid var(--gw-line);
  border-radius: 6px;
  cursor: pointer;
}
.gw-reset {
  width: 100%;
  border: 1px solid var(--gw-line) !important;
  border-radius: 8px;
  padding: 8px;
  margin-top: 22px;
  font-size: 11px !important;
}
.gw-reset:hover {
  background: var(--gw-control-hover);
}
.gw-notifications {
  position: absolute;
  right: 25px;
  top: 75px;
  z-index: 21;
  width: 280px;
  border-radius: 16px;
  padding: 22px;
  background: var(--gw-notification);
}
.gw-notifications > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.gw-notifications h2 {
  font-size: 15px;
  font-weight: 500;
}
.gw-notifications p {
  margin-top: 8px;
  font-size: 12px;
  color: var(--gw-muted);
}
.gw-toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 20px;
  border-radius: 12px;
  background: var(--gw-toast);
  color: var(--gw-toast-ink);
  box-shadow: 0 10px 30px var(--gw-toast-shadow);
  font-size: 12px;
  white-space: nowrap;
}
.gw-sun {
  display: none;
}
[data-theme="dark"] .gw-sun {
  display: block;
}
[data-theme="dark"] .gw-moon {
  display: none;
}
.gw-chart-months > span {
  position: absolute;
  white-space: nowrap;
}
.gw-chart-empty {
  padding: 35px 15px;
  min-height: 160px;
}

  }
  .gw-overview-grid {
    margin-bottom: 12px;
  }
  .gw-balance {
    min-height: 221px;
  }
  .gw-balance-value {
    font-size: 39px;

  .gw-balance-meta {
    font-size: 11px;
  }
  .gw-account {
    padding-top: 23px;
  }
  .gw-panel {
    border-radius: 15px;
    padding: 18px;
  }
  .gw-chart-wrap svg {
    height: 130px;
  }
  .gw-chart-summary strong {
    font-size: 22px;
  }
  .gw-chart-summary {
    gap: 35px;
  }
  .gw-panel-title {
    gap: 8px;
    margin-bottom: 18px;
  }
  .gw-footer {
    font-size: 8px;
    margin-top: 24px;
  }
  .gw-footer > span:last-child {
    display: none;
  }
  .gw-material {
    right: 4px;
    top: 65px;
    width: min(310px, calc(100% - 8px));
    padding: 20px;
    max-height: calc(100svh - 90px);
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--gw-scrollbar) transparent;
  }
  .gw-notifications {
    right: 4px;
    max-width: calc(100% - 8px);
  }
  .gw-transaction-name strong,
  .gw-transaction > strong {
    font-size: 11px;
  }
  .gw-search {
    padding: 7px;
    width: 100%;
  }
  .gw-search input {
    width: 100%;
    min-width: 0;
  }
  .gw-view:has(.gw-search) .gw-panel-title {
    flex-wrap: wrap;
  }
  .gw-report-stats {
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .gw-report-stats .gw-panel {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
  }
  .gw-report-stats .gw-panel-title {
    margin: 0;
  }
  .gw-report-stats .gw-panel-title svg {
    display: none;
  }
  .gw-report-stats strong {
    font-size: 26px;
  }
  .gw-report-stats section > span {
    grid-column: 1/-1;
    margin-top: 8px;
  }
  .gw-savings-intro {
    gap: 12px;
    padding: 10px 2px 26px;
    flex-wrap: wrap;
  }
  .gw-savings-intro strong {
    font-size: 34px;
  }
  .gw-savings-intro > span:last-child {
    display: none;
  }
  .gw-savings-orb {
    width: 52px;
    height: 52px;
  }
  .gw-view:has(.gw-savings-intro) .gw-goals {
    grid-template-columns: 1fr;
    gap: 25px;
  }
  .gw-view:has(.gw-search) {
    min-height: 370px;
  }
  .gw-toast {
    max-width: calc(100% - 30px);
    font-size: 11px;
    white-space: normal;
  }
  .gw-chart-months {
    font-size: 8px;
  }
}
@media (max-height: 550px) {
  .gw-material {
    top: 70px;
    max-height: calc(100svh - 110px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .gw-root * {
    scroll-behavior: auto !important;
    transition: none !important;
  }

.sp-wrap{color:var(--gw-ink,#1d1d1f)}
.sp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.9fr);gap:16px;align-items:start}
.sp-panel{background:var(--gw-panel,rgba(255,255,255,.55));border:1px solid var(--gw-line,rgba(0,0,0,.08));border-radius:22px;padding:20px;backdrop-filter:blur(18px)}
.sp-title{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.sp-title h2{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sp-title p{font-size:11px;opacity:.62;margin-top:2px}
.sp-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--gw-accent-soft,rgba(0,102,204,.1));color:var(--gw-accent,#0066cc);flex:none}
.sp-section{padding:14px 0;border-top:1px solid var(--gw-line,rgba(0,0,0,.08))}
.sp-section h3{font-size:12px;font-weight:600;margin-bottom:11px;opacity:.8}
.sp-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp-field{display:flex;flex-direction:column;gap:4px;min-width:0;margin-bottom:9px}
.sp-label,.sp-section h3{font-size:11px;font-weight:600;opacity:.75}
.sp-field small{font-size:10px;opacity:.5}
.sp-field input,.sp-field select,.sp-field textarea{width:100%;box-sizing:border-box;border:1px solid var(--gw-line,rgba(0,0,0,.1));border-radius:9px;background:var(--gw-field,rgba(255,255,255,.65));color:inherit;padding:8px 10px;font-size:12px;font-family:inherit;outline:none}
.sp-field input:focus,.sp-field select:focus,.sp-field textarea:focus{border-color:var(--gw-accent,#0066cc)}
.sp-field textarea{resize:vertical;min-height:44px}
.sp-check{display:flex;align-items:center;gap:7px;font-size:11px;opacity:.8;margin:8px 0}
.sp-inline-check{padding-top:18px}
.sp-drop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:11px;border:1px dashed var(--gw-line,rgba(0,0,0,.18));border-radius:11px;font-size:11px;opacity:.85}
.sp-mini{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--gw-line,rgba(0,0,0,.1));border-radius:8px;padding:6px 10px;font-size:11px;color:inherit;background:var(--gw-field,rgba(255,255,255,.65));cursor:pointer}
.sp-hidden{display:none!important}
.sp-filelist{margin:9px 0;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.sp-filerow{display:flex;align-items:center;gap:7px;font-size:11px;padding:4px 6px;border-radius:7px;background:rgba(127,127,127,.07)}
.sp-filerow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-filerow small{opacity:.55}
.sp-filerow button{border:0;background:transparent;color:inherit;cursor:pointer;opacity:.55;padding:2px}
.sp-more{font-size:10px;opacity:.5;padding-left:6px}
.sp-iconrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sp-thumb{width:36px;height:36px;border-radius:9px;border:1px solid var(--gw-line,rgba(0,0,0,.1));display:grid;place-items:center;overflow:hidden;background:rgba(127,127,127,.07)}
.sp-thumb img{width:100%;height:100%;object-fit:contain}
.sp-iconrow small{font-size:10px;opacity:.55}
.sp-info{font:10.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:280px;overflow:auto;margin:0;padding:12px;border-radius:12px;background:rgba(127,127,127,.09);color:inherit}
.sp-build{display:flex;flex-direction:column;gap:10px}
.sp-primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px 14px;border:0;border-radius:11px;background:var(--gw-accent,#0066cc);color:#fff;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none}
.sp-primary:disabled{opacity:.55;cursor:default}
.sp-download{background:rgba(0,102,204,.13);color:var(--gw-accent,#0066cc)}
.sp-actions{display:flex;flex-direction:column;gap:8px}
.sp-publish{background:var(--gw-accent,#0066cc)}
.sp-publish-msg{display:flex;align-items:center;gap:6px;font-size:11px;margin:2px 0 0;padding:8px 10px;border-radius:9px}
.sp-publish-msg svg{flex:none}
.sp-publish-msg.is-ok{background:rgba(40,160,90,.12);color:#18814a}
.sp-publish-msg.is-err{background:rgba(220,60,60,.1);color:#c62f2f}
.sp-error,.sp-okline{display:flex;align-items:center;gap:7px;font-size:11px;padding:9px 10px;border-radius:9px}
.sp-error{background:rgba(220,60,60,.1);color:#c62f2f}
.sp-okline{background:rgba(40,160,90,.12);color:#18814a}
.sp-done dl{margin:0;display:flex;flex-direction:column;gap:5px}
.sp-done dl div{display:flex;gap:10px;font-size:11px}
.sp-done dt{opacity:.55;min-width:44px}
.sp-done dd{margin:0;word-break:break-all}
.sp-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
.sp-note{font-size:10px;line-height:1.6;opacity:.5;margin:0}
.sp-history{display:flex;flex-direction:column;gap:7px;max-height:160px;overflow:auto}
.sp-history div{display:flex;flex-direction:column;gap:1px;padding:7px 9px;border-radius:9px;background:rgba(127,127,127,.07)}
.sp-history span{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-history small{font-size:10px;opacity:.55}
@media(max-width:900px){.sp-grid{grid-template-columns:1fr}.sp-fields{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.sp-fields{grid-template-columns:1fr}.sp-panel{padding:15px;border-radius:18px}}

.pc-card{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .18s ease,box-shadow .18s ease}
.pc-card:hover,.pc-card:focus-visible{transform:translateY(-3px)}
.pc-card-top{display:flex;align-items:center;gap:11px}
.pc-icon{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none;background:rgba(127,127,127,.12)}
.pc-icon-sm{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:none;background:rgba(127,127,127,.12)}
.pc-icon-lg{width:72px;height:72px;border-radius:16px;object-fit:cover;flex:none}
.pc-icon-fallback{display:grid;place-items:center;color:var(--gw-accent)}
.pc-card-title{display:flex;flex-direction:column;min-width:0;flex:1}
.pc-card-title strong{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-card-title span{font-size:10px;color:var(--gw-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-ver{font-size:10px;color:var(--gw-muted);background:var(--gw-segment);padding:3px 7px;border-radius:6px;white-space:nowrap;flex:none}
.pc-desc{font-size:11.5px;color:var(--gw-muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pc-tags{display:flex;gap:6px;flex-wrap:wrap}
.pc-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 8px;border-radius:6px;background:var(--gw-goal-surface);color:var(--gw-muted)}
.pc-tag-arch{color:var(--gw-accent);background:var(--gw-income-surface)}
.pc-card-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--gw-line);padding-top:11px;margin-top:auto}
.pc-size{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--gw-muted)}
.pc-channel{font-size:10px;color:var(--gw-muted)}
.pc-dl{margin-left:auto;padding:6px 10px;font-size:10px !important;border-radius:7px}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pc-empty{grid-column:1/-1}
.pc-section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.pc-section-head h2,.pc-section-head div{font-size:14px;font-weight:600}
.pc-section-head span{font-size:11px;color:var(--gw-muted)}
.pc-filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pc-search{flex:1;min-width:210px}
.pc-search input{width:100%;min-width:0}
.pc-arch-bars{display:flex;flex-direction:column;gap:15px;padding:6px 0 4px}
.pc-arch-row{display:flex;align-items:center;gap:12px;font-size:11px}
.pc-arch-name{display:inline-flex;align-items:center;gap:6px;width:88px;flex:none}
.pc-arch-track{flex:1;height:6px;margin:0}
.pc-arch-row strong{font-size:12px;font-weight:600;width:20px;text-align:right}
.pc-arch-bars-lg{gap:22px;padding:10px 0}
.pc-arch-foot{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}
.pc-mini-tag{font-size:10px;color:var(--gw-muted);background:var(--gw-goal-surface);padding:4px 9px;border-radius:6px}
.pc-list{display:flex;flex-direction:column}
.pc-list-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--gw-line)}
.pc-list-row:first-child{border-top:0;padding-top:0}
.pc-list-name{display:flex;flex-direction:column;flex:1;min-width:0}
.pc-list-name strong{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-list-name span{font-size:10px;color:var(--gw-muted)}
.pc-list-size{font-size:10px;color:var(--gw-muted);white-space:nowrap}
.pc-list-row .gw-button{padding:7px 11px;font-size:10px !important;border-radius:7px}
.pc-source-main{min-width:0;flex:1}
.pc-source-strong{font-size:clamp(15px,1.8vw,22px) !important;font-weight:500 !important;letter-spacing:-0.02em !important;word-break:break-all}
.pc-source-input{width:100%;font-size:clamp(13px,1.5vw,17px) !important;padding:8px 10px;border:1px solid var(--gw-accent) !important;border-radius:8px !important;background:var(--gw-panel) !important;color:var(--gw-text) !important}
.pc-copy{white-space:nowrap}
.pc-source-actions{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.pc-steps{list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:16px}
.pc-steps li{counter-increment:step;display:flex;flex-direction:column;gap:3px;padding-left:42px;position:relative}
.pc-steps li:before{content:counter(step);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--gw-income-surface);color:var(--gw-accent);display:grid;place-items:center;font-size:12px;font-weight:600}
.pc-steps strong{font-size:12px;font-weight:600}
.pc-steps span{font-size:11px;color:var(--gw-muted)}
.pc-source-note{align-items:flex-start}
.pc-source-note svg{flex:none;color:var(--gw-accent)}
.pc-about{font-size:12px;line-height:1.75;color:var(--gw-muted)}
.pc-about strong{color:var(--gw-ink)}
.pc-about-link{margin-top:18px;text-decoration:none}
.gw-badge{padding:3px 6px;border-radius:5px}
.pc-modal-mask{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:48px 16px}
.pc-modal{border-radius:22px;width:min(560px,100%);padding:26px;background:var(--gw-popover)}
.pc-modal-head{display:flex;align-items:flex-start;justify-content:space-between}
.pc-modal h2{font-size:22px;font-weight:600;letter-spacing:-0.03em;margin-top:14px}
.pc-modal-en{font-size:12px;color:var(--gw-muted)}
.pc-modal .gw-mver{display:inline-block;margin-top:12px;font-size:11px;color:var(--gw-accent);background:var(--gw-income-surface);padding:4px 10px;border-radius:7px}
.pc-modal .gw-mdesc{margin-top:16px;color:var(--gw-muted);font-size:12.5px;line-height:1.7}
@media (max-width:700px){
  .pc-search{min-width:100%}
  .pc-list-size{display:none}
  .pc-source-strong{font-size:15px !important}
}
.pc-up-open{padding:7px 12px;font-size:11px !important;border-radius:8px;white-space:nowrap}
.pc-tag-local{color:var(--gw-accent);background:var(--gw-income-surface);font-weight:600}
.pc-remove{margin-top:10px;width:100%;justify-content:center;color:#d9534f;border-color:rgba(217,83,79,.35) !important}
.pc-up{width:min(520px,100%);border-radius:22px;padding:24px;background:var(--gw-popover);border:1px solid var(--gw-line)}
.pc-up-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.pc-up-head h2{font-size:18px;font-weight:600;letter-spacing:-0.02em}
.pc-up-head p{font-size:11.5px;color:var(--gw-muted);line-height:1.6;margin-top:5px}
.pc-up-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:30px 18px;border-radius:16px;border:1.5px dashed var(--gw-line);background:var(--gw-goal-surface);cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .18s ease}
.pc-up-drop:hover{border-color:var(--gw-accent);transform:translateY(-1px)}
.pc-up-drop.is-drag{border-color:var(--gw-accent);border-style:solid;background:var(--gw-income-surface)}
.pc-up-drop.has-file{border-style:solid;border-color:var(--gw-accent)}
.pc-up-drop strong{font-size:12.5px;font-weight:600;word-break:break-all}
.pc-up-drop span{font-size:11px;color:var(--gw-muted)}
.pc-up-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--gw-income-surface);color:var(--gw-accent);margin-bottom:2px}
.pc-up-token{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:11px;color:var(--gw-muted)}
.pc-up-token input{padding:8px 10px;border-radius:8px;border:1px solid var(--gw-line);background:var(--gw-panel);color:var(--gw-text);font-size:12px}
.pc-up-progress{position:relative;height:22px;border-radius:7px;background:var(--gw-goal-surface);overflow:hidden;margin-top:14px}
.pc-up-progress span{position:absolute;inset:0 auto 0 0;background:var(--gw-accent);opacity:.35;transition:width .2s ease}
.pc-up-progress em{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-style:normal;color:var(--gw-text);font-weight:600}
.pc-up-msg{display:flex;align-items:center;gap:8px;margin-top:14px;padding:10px 12px;border-radius:10px;font-size:11.5px;line-height:1.5}
.pc-up-msg svg{flex:none}
.pc-up-msg.is-error{background:rgba(217,83,79,.1);color:#d9534f}
.pc-up-msg.is-done{background:var(--gw-income-surface);color:var(--gw-text);align-items:flex-start}
.pc-up-msg.is-done div{display:flex;flex-direction:column;gap:2px}
.pc-up-msg.is-done span{font-size:10.5px;color:var(--gw-muted)}
.pc-up-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.pc-up-send{background:var(--gw-accent) !important;color:#fff !important;border-color:transparent !important}
.pc-up-send:disabled{opacity:.5;cursor:not-allowed}
.pc-spin{animation:pc-spin .9s linear infinite}
@keyframes pc-spin{to{transform:rotate(360deg)}}
