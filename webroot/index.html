.nimbus-nav{--n-tint:rgba(255,255,255,.14);--n-fg:#0B132B;--n-fg-soft:rgba(11,19,43,.6);--n-rim:rgba(255,255,255,.7);

.nimbus-nav[data-tone="dark"]{--n-tint:rgba(10,18,40,.26);--n-fg:#F1F7FF;--n-fg-soft:rgba(241,247,255,.66);--n-rim:rgba(255,255,255,.34)}

.nimbus-water{position:absolute;left:${-mt}px;top:${-mt}px;z-index:-1;pointer-events:none}
.nimbus-nav[data-gl="off"] .nimbus-water{display:none}

@keyframes nvPlane{0%{transform:none}12%{transform:translate(-3px,2px) rotate(7deg)}42%{transform:translate(64px,-26px) rotate(-24deg) scale(.9);opacity:0}43%{transform:translate(-60px,16px) rotate(-12deg) scale(.9);opacity:0}58%{opacity:1}80%{transform:translate(3px,-1px) rotate(2deg)}100%{transform:translateY(-1px) scale(1.08)}}

.nv-ico[data-fx="drop"]::before,.nv-ico[data-fx="drop"]::after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:0;pointer-events:none}

@media (max-width:520px){.nimbus-nav:not([data-compact="false"]) .nimbus-item{padding:0 13px}.nimbus-nav:not([data-compact="false"]) .nimbus-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}

.gw-root[data-theme="light"] {
  color-scheme: light;
}
.gw-root[data-theme="dark"] {
  color-scheme: dark;
}
.gw-root * {
  box-sizing: border-box;
}
.gw-root ::selection {
  background: var(--gw-selection);
}
.gw-root button,
.gw-root input,
.gw-root a {
  font: inherit;
  color: inherit;
}
.gw-root button {
  cursor: pointer;
}
.gw-root button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
.gw-root button,
.gw-root a,
.gw-root input {
  outline-offset: 4px;
}
.gw-root :focus-visible {
  outline: 2px solid var(--gw-accent);
}
.gw-root button {
  border: 0;
  background: none;
}
.gw-root h1,
.gw-root h2,
.gw-root h3,
.gw-root p {
  margin: 0;
}
.gw-room {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 56%;
  z-index: -3;
}
.gw-room-shade {
  position: absolute;
  inset: 0;
  background: var(--gw-shade);
  z-index: -2;
}
.gw-workspace {
  position: relative;
  width: min(1280px, 100%);
  margin: auto;
}
.gw-glass {
  background: color-mix(
    in srgb,
    var(--gw-surface) calc(var(--gw-opacity) * 100%),
    transparent
  );
  backdrop-filter: blur(var(--gw-blur)) saturate(var(--gw-saturation));
  -webkit-backdrop-filter: blur(var(--gw-blur)) saturate(var(--gw-saturation));
  box-shadow:
    inset 0 1px 0
      color-mix(
        in srgb,
        var(--gw-highlight) calc(var(--gw-edge) * 100%),
        transparent
      ),
    inset 0 0 0 1px
      color-mix(
        in srgb,
        var(--gw-highlight) calc(var(--gw-edge) * 34%),
        transparent
      ),
    0 20px 52px -25px var(--gw-shadow);
  position: relative;
}
.gw-glass:before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--gw-tint);
  opacity: 0.12;
  pointer-events: none;
  border-radius: inherit;
}
.gw-topbar {
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-radius: 20px;
  margin-bottom: 18px;
  padding: 0 20px;
}
.gw-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  white-space: nowrap;
}
.gw-brand strong {
  font-size: 14px;
  letter-spacing: -0.025em;
}
.gw-brand-icon {
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  background: var(--gw-brand);
  color: var(--gw-brand-ink);
  border-radius: 9px;
}
.gw-brand-divider {
  height: 16px;
  width: 1px;
  background: var(--gw-line);
  margin: 0 4px;
}
.gw-personal {
  font-size: 12px;
  color: var(--gw-muted);
}
.gw-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
}
.gw-adjust {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 9px;
  padding: 8px 10px;
}
.gw-adjust:hover {
  background: var(--gw-hover);
}
.gw-icon-button {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  flex: none;
}
.gw-icon-button:hover {
  background: var(--gw-hover);
}
.gw-bell {
  position: relative;
}
.gw-bell i {
  position: absolute;
  right: 8px;
  top: 6px;
  background: var(--gw-accent);
  width: 4px;
  height: 4px;
  border-radius: 50%;
}
.gw-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--gw-avatar);
  display: grid;
  place-items: center;
  font:
    600 12px Georgia,
    serif;
}
.gw-stage {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.gw-rail {
  border-radius: 23px;
  width: 50px;
  padding: 8px 5px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 50px;
  flex: none;
}
.gw-rail button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.gw-rail button span {
  display: none;
}
.gw-rail button[aria-current] {
  background: var(--gw-rail-active);
  box-shadow: 0 3px 8px var(--gw-soft-shadow);
}
.gw-main {
  border-radius: 27px;
  padding: 30px 30px 98px;
  flex: 1;
  min-width: 0;
}
.gw-view-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 28px;
}
.gw-greeting {
  font-size: 13px;
  color: var(--gw-muted);
  margin-bottom: 5px !important;
}
.gw-view-heading h1 {
  font-size: clamp(23px, 2.3vw, 31px);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.18;
}
.gw-date {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--gw-muted);
  white-space: nowrap;
}
.gw-panel {
  background: color-mix(
    in srgb,
    var(--gw-panel) calc((0.16 + var(--gw-opacity) * 0.5) * 100%),
    transparent
  );
  border-radius: 17px;
  box-shadow:
    inset 0 1px 0
      color-mix(
        in srgb,
        var(--gw-highlight) calc(var(--gw-edge) * 75%),
        transparent
      ),
    0 8px 22px -20px var(--gw-panel-shadow);
  padding: 21px;
  min-width: 0;
  position: relative;
}
.gw-panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  color: var(--gw-muted);
  font-size: 12px;
}
.gw-panel-title h2 {
  font-size: 14px;
  letter-spacing: -0.02em;
  font-weight: 600;
  color: var(--gw-ink);
}
.gw-panel-title > svg {
  opacity: 0.65;
}
.gw-overview-grid {
  display: grid;
  grid-template-columns: 0.82fr 1.5fr;
  gap: 16px;
  margin-bottom: 16px;
}
.gw-balance {
  display: flex;
  flex-direction: column;
}
.gw-balance-value {
  font-size: clamp(29px, 3.15vw, 43px);
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1.25;
  white-space: nowrap;
}
.gw-balance-meta {
  font-size: 11px;
  color: var(--gw-muted);
  margin-top: 10px !important;
}
.gw-positive {
  color: var(--gw-accent);
}
.gw-balance-meta .gw-positive {
  background: var(--gw-positive-surface);
  border-radius: 5px;
  padding: 3px 5px;
  margin-right: 5px;
}
.gw-account {
  margin-top: auto;
  padding-top: 35px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.gw-account-icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--gw-account-surface);
}
.gw-account > div {
  display: flex;
  flex-direction: column;
}
.gw-account strong {
  font-weight: 500;
  font-size: 12px;
}
.gw-account span {
  font-size: 11px;
  color: var(--gw-muted);
}
.gw-account > button {
  margin-left: auto;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--gw-account-action);
  display: grid;
  place-items: center;
}
.gw-segment {
  display: flex;
  gap: 3px;
  background: var(--gw-segment);
  border-radius: 8px;
  padding: 3px;
  font-size: 10px;
}
.gw-segment button {
  padding: 4px 8px;
  border-radius: 6px;
}
.gw-segment button[aria-pressed="true"] {
  background: var(--gw-segment-active);
  box-shadow: 0 2px 4px var(--gw-segment-shadow);
  color: var(--gw-ink);
}
.gw-chart-summary {
  display: flex;
  gap: 34px;
  margin-bottom: 18px;
}
.gw-chart-legend {
  display: flex;
  gap: 20px;
  margin: -4px 0 14px;
  font-size: 11px;
  color: var(--gw-muted);
}
.gw-chart-legend span {
  display: flex;
  gap: 6px;
  align-items: center;
}
.gw-chart-legend i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gw-accent);
}
.gw-chart-legend span + span i {
  background: var(--gw-muted);
}
.gw-chart-summary > div {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.gw-chart-summary span {
  font-size: 10px;
  color: var(--gw-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}
.gw-chart-summary i {
  width: 5px;
  height: 5px;
  background: var(--gw-accent);
  border-radius: 50%;
}
.gw-chart-summary > div + div i {
  background: var(--gw-muted);
}
.gw-chart-summary strong {
  font-size: 21px;
  font-weight: 500;
  letter-spacing: -0.03em;
}
.gw-chart-wrap {
  position: relative;
  padding-left: 39px;
  padding-top: 2px;
}
.gw-chart-wrap svg {
  display: block;
  width: 100%;
  height: 126px;
  overflow: visible;
}
.gw-chart-labels {
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 8px;
  color: var(--gw-muted);
}
.gw-chart-months {
  position: relative;
  height: 24px;
  font-size: 9px;
  color: var(--gw-muted);
  padding-top: 10px;
}
.gw-lower-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 16px;
}
.gw-text-button {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px !important;
}
.gw-text-button:hover {
  color: var(--gw-accent);
}
.gw-transaction {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 0;
  border-top: 1px solid var(--gw-line);
  min-width: 0;
}
.gw-transaction:first-child {
  border-top: 0;
  padding-top: 0;
}
.gw-transaction:last-child {
  padding-bottom: 0;
}
.gw-transaction-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--gw-transaction-surface);
  flex: none;
}
.gw-transaction-icon.is-income {
  background: var(--gw-income-surface);
  color: var(--gw-accent);
}
.gw-transaction-name {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}
.gw-transaction-name strong {
  font-size: 12px;
  font-weight: 500;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.gw-transaction-name span {
  font-size: 10px;
  color: var(--gw-muted);
  margin-top: 2px;
}
.gw-transaction > strong {
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.gw-transaction-status {
  font-size: 9px;
  color: var(--gw-muted);
  display: flex;
  align-items: center;
  gap: 3px;
}
.gw-transaction-status.is-pending {
  color: var(--gw-pending);
}
.gw-small-label {
  font-size: 10px;
}
.gw-goal + .gw-goal {
  margin-top: 22px;
}
.gw-goal-top {
  display: flex;
  align-items: center;
  gap: 9px;
}
.gw-goal-top strong {
  font-size: 12px;
  font-weight: 500;
  flex: 1;
}
.gw-goal-top > span:last-child {
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-goal-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--gw-goal-surface);
  display: grid;
  place-items: center;
}
.gw-goal-track {
  height: 5px;
  background: var(--gw-line);
  margin: 11px 0 6px;
  border-radius: 5px;
  overflow: hidden;
}
.gw-goal-track i {
  height: 100%;
  display: block;
  background: var(--gw-accent);
  border-radius: 5px;
}
.gw-goal p {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-goal p strong {
  font-weight: 500;
  color: var(--gw-ink);
}
.gw-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--gw-muted);
  font-size: 9px;
  margin-top: 22px;
  gap: 16px;
}
.gw-footer > span:first-child {
  display: flex;
  align-items: center;
  gap: 6px;
}
.gw-footer i {
  height: 4px;
  width: 4px;
  background: var(--gw-accent);
  border-radius: 50%;
}
.gw-desktop-dock {
  position: absolute;
  bottom: 19px;
  left: 50%;
  transform: translateX(-50%);
}
.gw-dock {
  display: flex;
  align-items: center;
  gap: 3px;
  border-radius: 30px;
  padding: 5px;
  white-space: nowrap;
  background: var(--gw-dock);
  backdrop-filter: blur(20px);
}
.gw-dock button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 24px;
  padding: 10px 17px;
  font-size: 11px;
  transition:
    background 0.22s,
    color 0.22s;
}
.gw-dock button svg {
  width: 15px;
}
.gw-dock button[aria-current] {
  background: var(--gw-dock-active);
  color: var(--gw-dock-ink);
  box-shadow: 0 3px 7px var(--gw-dock-shadow);
}
.gw-dock button:not([aria-current]):hover {
  background: var(--gw-dock-hover);
}
.gw-mobile-nav {
  display: none;
}
.gw-button {
  padding: 9px 13px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--gw-button) !important;
  color: var(--gw-button-ink) !important;
  font-size: 11px !important;
  white-space: nowrap;
}
.gw-button:hover {
  filter: brightness(1.13);
}
.gw-search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--gw-search);
  border: 1px solid var(--gw-line);
  border-radius: 8px;
  padding: 7px 10px;
}
.gw-search input {
  width: 165px;
  background: none;
  border: 0;
  caret-color: var(--gw-accent);
  font-size: 11px;
}
.gw-search input::placeholder {
  color: var(--gw-muted);
}
.gw-search button {
  padding: 0;
  display: flex;
}
.gw-count {
  margin-left: 6px;
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-empty {
  text-align: center;
  padding: 70px 15px;
  color: var(--gw-muted);
  font-size: 12px;
}
.gw-empty svg {
  margin-bottom: 12px;
}
.gw-empty h3 {
  font-size: 15px;
  color: var(--gw-ink);
  margin-bottom: 6px;
}
.gw-empty button {
  margin-top: 15px;
  text-decoration: underline;
}
.gw-savings-intro {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px 10px 35px;
}
.gw-savings-orb {
  width: 65px;
  height: 65px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--gw-savings-orb);
  box-shadow: inset 0 1px 0 var(--gw-strong-edge);
}
.gw-savings-intro p {
  font-size: 12px;
  color: var(--gw-muted);
}
.gw-savings-intro strong {
  font-size: 40px;
  letter-spacing: -0.04em;
  font-weight: 500;
}
.gw-savings-intro > span:last-child {
  margin-left: auto;
  font-size: 13px;
  color: var(--gw-muted);
}
.gw-view:has(.gw-savings-intro) .gw-goals {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 34px;
}
.gw-view:has(.gw-savings-intro) .gw-goal + .gw-goal {
  margin-top: 0;
}
.gw-savings-note {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--gw-muted);
  font-size: 12px;
  padding: 24px 4px;
}
.gw-report-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.gw-report-stats strong {
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.035em;
  display: block;
}
.gw-report-stats section > span {
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-report-stats .gw-panel-title {
  margin-bottom: 15px;
}
.gw-reports-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 16px;
}
.gw-reports-grid .gw-chart-wrap svg {
  height: 185px;
}
.gw-chart-footnote {
  font-size: 9px;
  color: var(--gw-muted);
  margin-top: 15px !important;
}
.gw-category-list > div + div {
  margin-top: 19px;
}
.gw-category-list > div > div {
  display: flex;
  gap: 7px;
  align-items: center;
  font-size: 11px;
}
.gw-category-list strong {
  margin-left: auto;
  font-weight: 500;
}
.gw-category-list svg {
  width: 14px;
}
.gw-category-track {
  display: block;
  height: 4px;
  border-radius: 3px;
  background: var(--gw-line);
  margin-top: 9px;
}
.gw-category-track i {
  display: block;
  height: 100%;
  background: var(--gw-accent);
  border-radius: 3px;
}
.gw-material {
  position: absolute;
  z-index: 20;
  max-height: calc(100svh - 128px);
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--gw-scrollbar) transparent;
  right: 10px;
  top: 75px;
  width: 300px;
  border-radius: 22px;
  padding: 22px;
  background: var(--gw-popover);
  box-shadow:
    inset 0 1px 0 var(--gw-soft-edge),
    0 24px 80px var(--gw-popover-shadow);
}
.gw-material-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.gw-material-title > div {
  display: flex;
  gap: 10px;
  align-items: center;
}
.gw-material h2 {
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.03em;
}
.gw-material-icon {
  display: grid;
  place-items: center;
}
.gw-material > p {
  font-size: 11px;
  color: var(--gw-muted);
  margin: 7px 0 18px;
}
.gw-material-sample {
  height: 87px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border-radius: 13px;
  margin-bottom: 17px;
  background: color-mix(
    in srgb,
    var(--gw-tint) calc(var(--gw-opacity) * 100%),
    transparent
  );
  backdrop-filter: blur(var(--gw-blur));
  box-shadow:
    inset 0 1px 0
      color-mix(
        in srgb,
        var(--gw-highlight) calc(var(--gw-edge) * 100%),
        transparent
      ),
    0 12px 20px -18px var(--gw-sample-shadow);
  font-size: 12px;
}
.gw-presets {
  display: flex;
  gap: 5px;
  margin-bottom: 20px;
}
.gw-presets button {
  flex: 1;
  border: 1px solid var(--gw-line);
  border-radius: 7px;
  padding: 6px 0;
  font-size: 11px;
}
.gw-presets button:hover {
  background: var(--gw-control-hover);
}
.gw-range {
  display: block;
  margin: 17px 0;
}
.gw-range > span {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
}
.gw-range output {
  font-size: 10px;
  color: var(--gw-muted);
}
.gw-range input {
  width: 100%;
  accent-color: var(--gw-accent);
  height: 16px;
  margin: 8px 0 0;
  cursor: pointer;
}
.gw-tint {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  margin-top: 20px;
}
.gw-tint input {
  height: 28px;
  width: 42px;
  padding: 2px;
  background: none;
  border: 1px solid var(--gw-line);
  border-radius: 6px;
  cursor: pointer;
}
.gw-reset {
  width: 100%;
  border: 1px solid var(--gw-line) !important;
  border-radius: 8px;
  padding: 8px;
  margin-top: 22px;
  font-size: 11px !important;
}
.gw-reset:hover {
  background: var(--gw-control-hover);
}
.gw-notifications {
  position: absolute;
  right: 25px;
  top: 75px;
  z-index: 21;
  width: 280px;
  border-radius: 16px;
  padding: 22px;
  background: var(--gw-notification);
}
.gw-notifications > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.gw-notifications h2 {
  font-size: 15px;
  font-weight: 500;
}
.gw-notifications p {
  margin-top: 8px;
  font-size: 12px;
  color: var(--gw-muted);
}
.gw-toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 20px;
  border-radius: 12px;
  background: var(--gw-toast);
  color: var(--gw-toast-ink);
  box-shadow: 0 10px 30px var(--gw-toast-shadow);
  font-size: 12px;
  white-space: nowrap;
}
.gw-sun {
  display: none;
}
[data-theme="dark"] .gw-sun {
  display: block;
}
[data-theme="dark"] .gw-moon {
  display: none;
}
.gw-chart-months > span {
  position: absolute;
  white-space: nowrap;
}
.gw-chart-empty {
  padding: 35px 15px;
  min-height: 160px;
}
@supports not (backdrop-filter: blur(1px)) {
  .gw-glass,
  .gw-panel {
    background: var(--gw-fallback);
  }
}
@media (min-width: 1550px) {
  .gw-root {
    padding-top: 65px;
  }
  .gw-main {
    padding-top: 36px;
  }
  .gw-chart-wrap svg {
    height: 150px;
  }
  .gw-panel {
    padding: 25px;
  }
  .gw-transaction {
    padding: 14px 0;
  }
}
@media (max-width: 1050px) {
  .gw-root {
    padding: 24px 18px;
  }
  .gw-main {
    padding: 25px 23px 92px;
  }
  .gw-rail {
    display: none;
  }
  .gw-balance-value {
    font-size: 32px;
  }
  .gw-transaction-status {
    display: none;
  }
  .gw-personal,
  .gw-brand-divider {
    display: none;
  }
  .gw-panel {
    padding: 18px;
  }
  .gw-chart-summary {
    gap: 20px;
  }
  .gw-chart-summary strong {
    font-size: 19px;
  }
}
@media (max-width: 700px) {
  .gw-root {
    padding: 12px 10px 24px;
  }
  .gw-topbar {
    height: 56px;
    padding: 0 12px;
    border-radius: 17px;
    margin-bottom: 12px;
  }
  .gw-toolbar {
    gap: 3px;
  }
  .gw-brand {
    gap: 7px;
  }
  .gw-brand strong {
    font-size: 12px;
  }
  .gw-brand-icon {
    width: 25px;
    height: 25px;
  }
  .gw-bell,
  .gw-avatar {
    display: none !important;
  }
  .gw-adjust {
    padding: 8px;
    font-size: 11px !important;
    gap: 5px;
  }
  .gw-main {
    border-radius: 20px;
    padding: 23px 15px;
  }
  .gw-view-heading {
    gap: 8px;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .gw-view-heading h1 {
    font-size: 25px;
    max-width: 290px;
    line-height: 1.12;
  }
  .gw-greeting {
    font-size: 11px;
  }
  .gw-heading-action .gw-date {
    display: none;
  }
  .gw-heading-action .gw-button {
    padding: 8px 10px;
    font-size: 10px !important;
  }
  .gw-mobile-nav {
    display: block;
    margin-bottom: 20px;
  }
  .gw-mobile-nav .gw-dock {
    width: 100%;
    padding: 4px;
    border-radius: 12px;
    justify-content: space-between;
    background: var(--gw-mobile-dock);
    box-shadow: none;
  }
  .gw-dock button {
    font-size: 10px;
    padding: 9px 10px;
    border-radius: 9px;
    gap: 5px;
  }
  .gw-dock button svg {
    width: 13px;
    height: 13px;
  }
  .gw-desktop-dock {
    display: none;
  }
  .gw-overview-grid,
  .gw-lower-grid,
  .gw-reports-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .gw-overview-grid {
    margin-bottom: 12px;
  }
  .gw-balance {
    min-height: 221px;
  }
  .gw-balance-value {
    font-size: 39px;
  }
  .gw-balance-meta {
    font-size: 11px;
  }
  .gw-account {
    padding-top: 23px;
  }
  .gw-panel {
    border-radius: 15px;
    padding: 18px;
  }
  .gw-chart-wrap svg {
    height: 130px;
  }
  .gw-chart-summary strong {
    font-size: 22px;
  }
  .gw-chart-summary {
    gap: 35px;
  }
  .gw-panel-title {
    gap: 8px;
    margin-bottom: 18px;
  }
  .gw-footer {
    font-size: 8px;
    margin-top: 24px;
  }
  .gw-footer > span:last-child {
    display: none;
  }
  .gw-material {
    right: 4px;
    top: 65px;
    width: min(310px, calc(100% - 8px));
    padding: 20px;
    max-height: calc(100svh - 90px);
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--gw-scrollbar) transparent;
  }
  .gw-notifications {
    right: 4px;
    max-width: calc(100% - 8px);
  }
  .gw-transaction-name strong,
  .gw-transaction > strong {
    font-size: 11px;
  }
  .gw-search {
    padding: 7px;
    width: 100%;
  }
  .gw-search input {
    width: 100%;
    min-width: 0;
  }
  .gw-view:has(.gw-search) .gw-panel-title {
    flex-wrap: wrap;
  }
  .gw-report-stats {
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .gw-report-stats .gw-panel {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
  }
  .gw-report-stats .gw-panel-title {
    margin: 0;
  }
  .gw-report-stats .gw-panel-title svg {
    display: none;
  }
  .gw-report-stats strong {
    font-size: 26px;
  }
  .gw-report-stats section > span {
    grid-column: 1/-1;
    margin-top: 8px;
  }
  .gw-savings-intro {
    gap: 12px;
    padding: 10px 2px 26px;
    flex-wrap: wrap;
  }
  .gw-savings-intro strong {
    font-size: 34px;
  }
  .gw-savings-intro > span:last-child {
    display: none;
  }
  .gw-savings-orb {
    width: 52px;
    height: 52px;
  }
  .gw-view:has(.gw-savings-intro) .gw-goals {
    grid-template-columns: 1fr;
    gap: 25px;
  }
  .gw-view:has(.gw-search) {
    min-height: 370px;
  }
  .gw-toast {
    max-width: calc(100% - 30px);
    font-size: 11px;
    white-space: normal;
  }
  .gw-chart-months {
    font-size: 8px;
  }
}
@media (max-height: 550px) {
  .gw-material {
    top: 70px;
    max-height: calc(100svh - 110px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .gw-root * {

  }

.sp-wrap{color:var(--gw-ink,#1d1d1f)}
.sp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.9fr);gap:16px;align-items:start}
.sp-panel{background:var(--gw-panel,rgba(255,255,255,.55));border:1px solid var(--gw-line,rgba(0,0,0,.08));border-radius:22px;padding:20px;backdrop-filter:blur(18px)}
.sp-title{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.sp-title h2{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sp-title p{font-size:11px;opacity:.62;margin-top:2px}
.sp-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--gw-accent-soft,rgba(0,102,204,.1));color:var(--gw-accent,#0066cc);flex:none}
.sp-section{padding:14px 0;border-top:1px solid var(--gw-line,rgba(0,0,0,.08))}
.sp-section h3{font-size:12px;font-weight:600;margin-bottom:11px;opacity:.8}
.sp-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp-field{display:flex;flex-direction:column;gap:4px;min-width:0;margin-bottom:9px}
.sp-label,.sp-section h3{font-size:11px;font-weight:600;opacity:.75}
.sp-field small{font-size:10px;opacity:.5}
.sp-field input,.sp-field select,.sp-field textarea{width:100%;box-sizing:border-box;border:1px solid var(--gw-line,rgba(0,0,0,.1));border-radius:9px;background:var(--gw-field,rgba(255,255,255,.65));color:inherit;padding:8px 10px;font-size:12px;font-family:inherit;outline:none}
.sp-field input:focus,.sp-field select:focus,.sp-field textarea:focus{border-color:var(--gw-accent,#0066cc)}
.sp-field textarea{resize:vertical;min-height:44px}
.sp-check{display:flex;align-items:center;gap:7px;font-size:11px;opacity:.8;margin:8px 0}
.sp-inline-check{padding-top:18px}
.sp-drop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:11px;border:1px dashed var(--gw-line,rgba(0,0,0,.18));border-radius:11px;font-size:11px;opacity:.85}
.sp-mini{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--gw-line,rgba(0,0,0,.1));border-radius:8px;padding:6px 10px;font-size:11px;color:inherit;background:var(--gw-field,rgba(255,255,255,.65));cursor:pointer}
.sp-hidden{display:none!important}
.sp-filelist{margin:9px 0;max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.sp-filerow{display:flex;align-items:center;gap:7px;font-size:11px;padding:4px 6px;border-radius:7px;background:rgba(127,127,127,.07)}
.sp-filerow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-filerow small{opacity:.55}
.sp-filerow button{border:0;background:transparent;color:inherit;cursor:pointer;opacity:.55;padding:2px}
.sp-more{font-size:10px;opacity:.5;padding-left:6px}
.sp-iconrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sp-thumb{width:36px;height:36px;border-radius:9px;border:1px solid var(--gw-line,rgba(0,0,0,.1));display:grid;place-items:center;overflow:hidden;background:rgba(127,127,127,.07)}
.sp-thumb img{width:100%;height:100%;object-fit:contain}
.sp-iconrow small{font-size:10px;opacity:.55}
.sp-info{font:10.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:280px;overflow:auto;margin:0;padding:12px;border-radius:12px;background:rgba(127,127,127,.09);color:inherit}
.sp-build{display:flex;flex-direction:column;gap:10px}
.sp-primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:11px 14px;border:0;border-radius:11px;background:var(--gw-accent,#0066cc);color:#fff;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none}
.sp-primary:disabled{opacity:.55;cursor:default}
.sp-download{background:rgba(0,102,204,.13);color:var(--gw-accent,#0066cc)}
.sp-actions{display:flex;flex-direction:column;gap:8px}
.sp-publish{background:var(--gw-accent,#0066cc)}
.sp-publish-msg{display:flex;align-items:center;gap:6px;font-size:11px;margin:2px 0 0;padding:8px 10px;border-radius:9px}
.sp-publish-msg svg{flex:none}
.sp-publish-msg.is-ok{background:rgba(40,160,90,.12);color:#18814a}
.sp-publish-msg.is-err{background:rgba(220,60,60,.1);color:#c62f2f}
.sp-error,.sp-okline{display:flex;align-items:center;gap:7px;font-size:11px;padding:9px 10px;border-radius:9px}
.sp-error{background:rgba(220,60,60,.1);color:#c62f2f}
.sp-okline{background:rgba(40,160,90,.12);color:#18814a}
.sp-done dl{margin:0;display:flex;flex-direction:column;gap:5px}
.sp-done dl div{display:flex;gap:10px;font-size:11px}
.sp-done dt{opacity:.55;min-width:44px}
.sp-done dd{margin:0;word-break:break-all}
.sp-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px}
.sp-note{font-size:10px;line-height:1.6;opacity:.5;margin:0}
.sp-history{display:flex;flex-direction:column;gap:7px;max-height:160px;overflow:auto}
.sp-history div{display:flex;flex-direction:column;gap:1px;padding:7px 9px;border-radius:9px;background:rgba(127,127,127,.07)}
.sp-history span{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-history small{font-size:10px;opacity:.55}
@media(max-width:900px){.sp-grid{grid-template-columns:1fr}.sp-fields{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.sp-fields{grid-template-columns:1fr}.sp-panel{padding:15px;border-radius:18px}}

.gpc-rail-tools{flex:none;width:60px;margin-top:50px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:3}
/* 竖向液态导航旋转 90° 后视觉高度=原宽度，用固定占位块撑开布局；7 项约 318px */
.gpc-rail-nav-wrap{flex:none;width:54px;height:318px;display:flex;align-items:center;justify-content:center;position:relative}
.gpc-rail-tools .nimbus-nav{transform-origin:center center}
.gw-tool-mobile{display:none}
.gw-brand-logo{width:100%;height:100%;border-radius:inherit;object-fit:cover;display:block}
.gw-set-group{border-top:1px solid var(--gw-line);padding-top:16px;margin-top:4px}
.gw-set-group:first-of-type{border-top:0;padding-top:0;margin-top:0}
.gw-set-group-title{font-size:12px;font-weight:600;color:var(--gw-ink);margin:0 0 12px}
.gw-set-group>p{font-size:11px;color:var(--gw-muted);margin:2px 0 14px}
.gw-site-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gw-site-name-value{font-size:13px;font-weight:600;color:var(--gw-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.gw-site-name-input{flex:1;min-width:0;padding:6px 9px;border-radius:8px;border:1px solid var(--gw-accent);background:var(--gw-panel);color:var(--gw-text);font-size:12px}
.gw-site-logo-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.gw-site-logo-preview{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--gw-brand);color:var(--gw-brand-ink)}
.gw-site-logo-preview img{width:100%;height:100%;object-fit:cover}
.gw-site-logo-actions{display:flex;gap:8px;flex-wrap:wrap}
.gw-site-logo-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.gw-set-hint{font-size:10px;color:var(--gw-muted);line-height:1.55;margin:12px 0 0}
@media (max-width:1050px){
  .gpc-rail-tools{display:none}
  .gw-tool-mobile{display:grid}
}
.pc-card{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .18s ease,box-shadow .18s ease}
.pc-card:hover,.pc-card:focus-visible{transform:translateY(-3px)}
.pc-card-top{display:flex;align-items:center;gap:11px}
.pc-icon{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none;background:rgba(127,127,127,.12)}
.pc-icon-sm{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:none;background:rgba(127,127,127,.12)}
.pc-icon-lg{width:72px;height:72px;border-radius:16px;object-fit:cover;flex:none}
.pc-icon-fallback{display:grid;place-items:center;color:var(--gw-accent)}
.pc-card-title{display:flex;flex-direction:column;min-width:0;flex:1}
.pc-card-title strong{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-card-title span{font-size:10px;color:var(--gw-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-ver{font-size:10px;color:var(--gw-muted);background:var(--gw-segment);padding:3px 7px;border-radius:6px;white-space:nowrap;flex:none}
.pc-desc{font-size:11.5px;color:var(--gw-muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
